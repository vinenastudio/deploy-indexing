name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 20
      - run: node --test test/
      - name: Dry run against the fixture host
        uses: ./
        with:
          site-url: https://example.com
          indexnow-key: 00000000000000000000000000000000
          dry-run: true
